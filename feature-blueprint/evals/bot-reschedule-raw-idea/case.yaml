schema_version: "1.1"
name: bot-reschedule-raw-idea
expected_outcome: |
  Агент без кода проекта строит спецификацию переноса записи в боте: сценарии с ветками сбоя, схема
  Mermaid, состояния сообщений бота, конфликт занятого слота, устаревшие кнопки, брошенный
  посередине перенос, часовые пояса, уведомление мастера/администратора, правила переноса как
  решение владельца, платформенные детали не выдумываются, а отправляются на сверку с профильным
  скиллом или документацией. Код не пишется.

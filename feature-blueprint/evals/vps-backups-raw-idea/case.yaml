schema_version: "1.1"
name: vps-backups-raw-idea
description: An internal mechanism from a raw idea, backups of a shop on one VPS, with no project
expected_outcome: |
  With nobody to answer questions, the agent writes down how backups of the database, the
  uploaded images and the queue should work and how to build them, and saves the result as files.
  No code or config is written. How well the design catches the problems of this mechanism is
  judged by compare/run.py against traps.md, not by the graders here.
